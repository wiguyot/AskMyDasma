# OC-13 dedicated comparison services (non-destructive override).
#
# Controlled regular/v2 comparison: both explainability services consume the
# SAME dedicated HSTree topic (own consumer groups) and publish to their own
# dedicated topics. Every resource carries the OC13_RUN_ID generated by the
# runner: topics, consumer groups and Avro subjects (TopicNameStrategy derives
# the subject from the dedicated topic names). The standard compose resources
# are never touched; the runner refuses to start when standard compute
# services are running.
#
# No Telegraf, Grafana or InfluxDB service here: OC-13 is a scientific
# comparison of the raw Kafka JSON exports. Nothing is deleted by this file.

services:
  oc13-producer:
    image: dasma-kafka-producer:0.1.0
    container_name: oc13-producer-${OC13_RUN_ID}
    working_dir: /app
    volumes:
      - ./:/app:ro
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      TOPIC_NAME: "oc13-source-${OC13_RUN_ID}"
      DATA_SOURCE_FILE: "tests/fixtures/explainability_v2/oc13_source.csv"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      TIME_DELAY: "0.0001"
      PIP_CACHE_DIR: "/pip-cache"
      DASMA_PRODUCER_TRANSFORMATION: ""
      DASMA_SELECTED_GROUPS: ""
      DASMA_EXCLUDED_FIELDS: ""
      DASMA_PRODUCER_WAIT_FOR_START: "0"
    networks: [kafka-net]
    depends_on:
      kafka1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    restart: "no"

  oc13-hstree:
    image: dasma-kafka-anomaly-light:0.1.0
    container_name: oc13-hstree-${OC13_RUN_ID}
    working_dir: /app
    volumes:
      - ./:/app:ro
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_SOURCE_TOPIC: "oc13-source-${OC13_RUN_ID}"
      KAFKA_DEST_TOPIC: "oc13-hstree-${OC13_RUN_ID}"
      KAFKA_DEST_VIZ_TOPIC: "oc13-hstree-viz-${OC13_RUN_ID}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      TOPIC_PARTITIONS: "1"
      TOPIC_RF: "3"
      LOG_LEVEL: "INFO"
      HSTREE_INITIAL_WINDOW_SIZE: "100"
      HSTREE_WINDOW_SIZE: "2048"
      HSTREE_NUM_TREES: "50"
      HSTREE_MAX_DEPTH: "15"
      HSTREE_EXCLUDE_FIELDS: "source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber"
      HSTREE_ANOMALY_K_SIGMA: "3.0"
      HSTREE_ANOMALY_MIN_SAMPLES: "2"
      HSTREE_THRESHOLD_MODE: "welford-windowed"
      ANALYSE_HSTREE_GROUP_ID: "oc13-hstree-consumer-${OC13_RUN_ID}"
      ANALYSE_SEED: "42"
      DASMA_ENABLED: "1"
      PIP_CACHE_DIR: "/pip-cache"
    networks: [kafka-net]
    depends_on:
      kafka1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    entrypoint: ["python", "/app/runtime/detectors/hstree/hstree_analysis.py"]
    restart: "no"

  oc13-regular:
    image: dasma-kafka-explainability:0.1.0
    container_name: oc13-regular-${OC13_RUN_ID}
    working_dir: /app
    volumes:
      - ./:/app
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_SOURCE_TOPIC: "oc13-hstree-${OC13_RUN_ID}"
      EXPLAINABILITY_MODEL: "hstree"
      EXPLAINABILITY_MODE: "reference"
      EXPLAINABILITY_METHOD: "kernel"
      KAFKA_DEST_TOPIC: "oc13-regular-${OC13_RUN_ID}"
      KAFKA_DEST_TOPIC_JSON: "oc13-regular-viz-${OC13_RUN_ID}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      EXPLAINABILITY_GROUP_ID: "oc13-regular-consumer-${OC13_RUN_ID}"
      TOPIC_PARTITIONS: "1"
      TOPIC_RF: "3"
      LOG_LEVEL: "INFO"
      HSTREE_INITIAL_WINDOW_SIZE: "100"
      HSTREE_WINDOW_SIZE: "2048"
      HSTREE_NUM_TREES: "50"
      HSTREE_MAX_DEPTH: "15"
      HSTREE_EXCLUDE_FIELDS: "source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber"
      SHAP_BACKGROUND_SIZE: "100"
      SHAP_NSAMPLES: "100"
      SHAP_ENABLED: "true"
      EXPLAINABILITY_SEED: "42"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      DASMA_ENABLED: "1"
      PIP_CACHE_DIR: "/pip-cache"
    networks: [kafka-net]
    depends_on:
      kafka1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    entrypoint: ["python", "/app/runtime/explainability/regular/explainability-multi-thread-by-group.py"]
    restart: "no"

  oc13-v2:
    image: dasma-kafka-explainability:0.1.0
    container_name: oc13-v2-${OC13_RUN_ID}
    working_dir: /app
    volumes:
      - ./:/app
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_SOURCE_TOPIC: "oc13-hstree-${OC13_RUN_ID}"
      EXPLAINABILITY_MODEL: "hstree"
      EXPLAINABILITY_MODE: "reference"
      EXPLAINABILITY_METHOD: "kernel"
      KAFKA_DEST_TOPIC: "oc13-v2-${OC13_RUN_ID}"
      KAFKA_DEST_TOPIC_JSON: "oc13-v2-viz-${OC13_RUN_ID}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      EXPLAINABILITY_GROUP_ID: "oc13-v2-consumer-${OC13_RUN_ID}"
      TOPIC_PARTITIONS: "1"
      TOPIC_RF: "3"
      LOG_LEVEL: "INFO"
      HSTREE_INITIAL_WINDOW_SIZE: "100"
      HSTREE_WINDOW_SIZE: "2048"
      HSTREE_NUM_TREES: "50"
      HSTREE_MAX_DEPTH: "15"
      HSTREE_EXCLUDE_FIELDS: "source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber"
      SHAP_BACKGROUND_SIZE: "100"
      SHAP_NSAMPLES: "100"
      SHAP_ENABLED: "true"
      EXPLAINABILITY_SEED: "42"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      DASMA_ENABLED: "1"
      PIP_CACHE_DIR: "/pip-cache"
    networks: [kafka-net]
    depends_on:
      kafka1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    entrypoint: ["python", "/app/runtime/explainability/v2/explainability_v2.py"]
    restart: "no"
