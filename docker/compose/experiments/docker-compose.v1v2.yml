# V1-06 dedicated parity witness services (non-destructive override).
#
# Controlled V1/V2 parity campaign: both explainability services consume the
# SAME dedicated HSTree topic (own consumer groups) and publish to their own
# dedicated topics. Every resource carries the V1V2_RUN_ID generated by the
# runner: topics, consumer groups and Avro subjects (TopicNameStrategy derives
# the subject from the dedicated topic names). The standard compose resources
# are never touched; the runner refuses to start when standard compute
# services are running.
#
# Differences with the frozen OC-13 comparison (docker/compose/experiments/docker-compose.oc13.yml):
# - the source fixture is the OC-12 campaign CSV, which carries ONE deliberate
#   (Group, timestamp) collision pair with distinct source_event_id values;
#   V1-06 compares on the exclusive (Group, source_event_id) identity, so the
#   collision is exercised instead of being forbidden;
# - the V1 side is the regular worker aligned by V1-01: it requires and
#   publishes source_event_id.
#
# No Telegraf, Grafana or InfluxDB service here: V1-06 is a scientific
# comparison of the raw Kafka JSON exports. Nothing is deleted by this file.

services:
  v1v2-producer:
    image: dasma-kafka-producer:0.1.0
    container_name: v1v2-producer-${V1V2_RUN_ID}
    working_dir: /app
    volumes:
      - ./:/app:ro
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      TOPIC_NAME: "v1v2-source-${V1V2_RUN_ID}"
      TOPIC_NAME_VIZ: "v1v2-source-viz-${V1V2_RUN_ID}"
      DATA_SOURCE_FILE: "${V1V2_SOURCE_CSV:-tests/fixtures/explainability_v2/oc12_source.csv}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      TIME_DELAY: "${V1V2_TIME_DELAY:-0.0001}"
      PIP_CACHE_DIR: "/pip-cache"
      DASMA_PRODUCER_TRANSFORMATION: ""
      DASMA_SELECTED_GROUPS: ""
      DASMA_EXCLUDED_FIELDS: ""
      DASMA_PRODUCER_WAIT_FOR_START: "0"
    networks: [kafka-net]
    depends_on:
      kafka1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    restart: "no"

  v1v2-hstree:
    image: dasma-kafka-anomaly-light:0.1.0
    container_name: v1v2-hstree-${V1V2_RUN_ID}
    working_dir: /app
    volumes:
      - ./:/app:ro
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_SOURCE_TOPIC: "v1v2-source-${V1V2_RUN_ID}"
      KAFKA_DEST_TOPIC: "v1v2-hstree-${V1V2_RUN_ID}"
      KAFKA_DEST_VIZ_TOPIC: "v1v2-hstree-viz-${V1V2_RUN_ID}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      TOPIC_PARTITIONS: "${V1V2_TOPIC_PARTITIONS:-1}"
      TOPIC_RF: "3"
      LOG_LEVEL: "INFO"
      HSTREE_INITIAL_WINDOW_SIZE: "256"
      HSTREE_WINDOW_SIZE: "256"
      HSTREE_NUM_TREES: "${V1V2_HSTREE_NUM_TREES:-25}"
      HSTREE_VARIANT: "${V1V2_HSTREE_VARIANT:-paper}"
      HSTREE_MAX_DEPTH: "15"
      HSTREE_EXCLUDE_FIELDS: "source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber"
      HSTREE_ANOMALY_K_SIGMA: "3.0"
      HSTREE_ANOMALY_MIN_SAMPLES: "2"
      HSTREE_THRESHOLD_MODE: "welford-windowed"
      ANALYSE_HSTREE_GROUP_ID: "v1v2-hstree-consumer-${V1V2_RUN_ID}"
      ANALYSE_SEED: "${ANALYSE_SEED:-42}"
      DASMA_ENABLED: "1"
      DASMA_Q3_TRACE_DIR: "${V1V2_Q3_TRACE_CONTAINER_DIR:-}"
      DASMA_Q3_TRACE_RUN_ID: "${V1V2_RUN_ID}"
      DASMA_Q3_TRACE_SERVICE: "hstree-upstream"
      PIP_CACHE_DIR: "/pip-cache"
    networks: [kafka-net]
    depends_on:
      kafka1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    entrypoint: ["python", "/app/runtime/detectors/hstree/hstree_analysis.py"]
    restart: "no"

  v1v2-regular:
    image: dasma-kafka-explainability:0.1.0
    container_name: v1v2-regular-${V1V2_RUN_ID}
    working_dir: /app
    volumes:
      - ./:/app
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_SOURCE_TOPIC: "v1v2-hstree-${V1V2_RUN_ID}"
      EXPLAINABILITY_MODEL: "hstree"
      EXPLAINABILITY_MODE: "reference"
      EXPLAINABILITY_METHOD: "kernel"
      KAFKA_DEST_TOPIC: "v1v2-regular-${V1V2_RUN_ID}"
      KAFKA_DEST_TOPIC_JSON: "v1v2-regular-viz-${V1V2_RUN_ID}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      EXPLAINABILITY_GROUP_ID: "v1v2-regular-consumer-${V1V2_RUN_ID}"
      TOPIC_PARTITIONS: "${V1V2_TOPIC_PARTITIONS:-1}"
      TOPIC_RF: "3"
      LOG_LEVEL: "INFO"
      HSTREE_INITIAL_WINDOW_SIZE: "256"
      HSTREE_WINDOW_SIZE: "256"
      HSTREE_NUM_TREES: "${V1V2_HSTREE_NUM_TREES:-25}"
      HSTREE_VARIANT: "${V1V2_HSTREE_VARIANT:-paper}"
      HSTREE_MAX_DEPTH: "15"
      HSTREE_EXCLUDE_FIELDS: "source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber"
      SHAP_BACKGROUND_SIZE: "100"
      SHAP_NSAMPLES: "100"
      SHAP_ENABLED: "true"
      ANALYSE_SEED: "${ANALYSE_SEED:-42}"
      EXPLAINABILITY_SEED: "42"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      DASMA_ENABLED: "1"
      DASMA_Q3_TRACE_DIR: "${V1V2_Q3_TRACE_CONTAINER_DIR:-}"
      DASMA_Q3_TRACE_RUN_ID: "${V1V2_RUN_ID}"
      DASMA_Q3_TRACE_SERVICE: "explainability-v1"
      PIP_CACHE_DIR: "/pip-cache"
    networks: [kafka-net]
    depends_on:
      kafka1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    entrypoint: ["python", "/app/runtime/explainability/regular/explainability-multi-thread-by-group.py"]
    stop_grace_period: 45s
    restart: "no"

  v1v2-v2:
    image: dasma-kafka-explainability:0.1.0
    container_name: v1v2-v2-${V1V2_RUN_ID}
    working_dir: /app
    volumes:
      - ./:/app
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_SOURCE_TOPIC: "v1v2-hstree-${V1V2_RUN_ID}"
      EXPLAINABILITY_MODEL: "hstree"
      EXPLAINABILITY_MODE: "reference"
      EXPLAINABILITY_METHOD: "kernel"
      KAFKA_DEST_TOPIC: "v1v2-v2-${V1V2_RUN_ID}"
      KAFKA_DEST_TOPIC_JSON: "v1v2-v2-viz-${V1V2_RUN_ID}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      EXPLAINABILITY_GROUP_ID: "v1v2-v2-consumer-${V1V2_RUN_ID}"
      TOPIC_PARTITIONS: "${V1V2_TOPIC_PARTITIONS:-1}"
      TOPIC_RF: "3"
      LOG_LEVEL: "INFO"
      HSTREE_INITIAL_WINDOW_SIZE: "256"
      HSTREE_WINDOW_SIZE: "256"
      HSTREE_NUM_TREES: "${V1V2_HSTREE_NUM_TREES:-25}"
      HSTREE_VARIANT: "${V1V2_HSTREE_VARIANT:-paper}"
      HSTREE_MAX_DEPTH: "15"
      HSTREE_EXCLUDE_FIELDS: "source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber"
      SHAP_BACKGROUND_SIZE: "100"
      SHAP_NSAMPLES: "100"
      SHAP_ENABLED: "true"
      ANALYSE_SEED: "${ANALYSE_SEED:-42}"
      EXPLAINABILITY_SEED: "42"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      DASMA_ENABLED: "1"
      DASMA_Q3_TRACE_DIR: "${V1V2_Q3_TRACE_CONTAINER_DIR:-}"
      DASMA_Q3_TRACE_RUN_ID: "${V1V2_RUN_ID}"
      DASMA_Q3_TRACE_SERVICE: "explainability-v2"
      PIP_CACHE_DIR: "/pip-cache"
    networks: [kafka-net]
    depends_on:
      kafka1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    entrypoint: ["python", "/app/runtime/explainability/v2/explainability_v2.py"]
    stop_grace_period: 45s
    restart: "no"
