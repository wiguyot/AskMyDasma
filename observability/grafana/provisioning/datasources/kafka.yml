apiVersion: 1

datasources:
  - name: Kafka Analysis
    uid: kafka-analysis
    type: hamedkarbasi93-kafka-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      # Broker address as seen from the Grafana container.
      #brokers: "kafka1:9092,kafka2:9092,kafka3:9092"
      brokers: "kafka1:9092"
      #bootstrapServers: "kafka1:9092,kafka2:9092,kafka3:9092"
      bootstrapServers: "kafka1:9092"
      # Timeout de connexion (sec)
      connectionTimeout: 2
      # No auth or SSL in this setup.
      useSASL: false
      useTLS: false
