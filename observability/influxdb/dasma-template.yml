apiVersion: influxdata.com/v2alpha1
kind: Variable
metadata:
    name: compassionate-lamport-e73017
spec:
    language: flux
    name: group
    query: |-
        import "influxdata/influxdb/schema"
        import "array"

        all = array.from(rows: [{_value: "ALL"}])

        groups =
          schema.tagValues(
            bucket: "source-data",
            tag: "Group",
            predicate: (r) => r._measurement == "source-data",
            start: 2020-01-01T00:00:00Z,
          )
          |> keep(columns: ["_value"])

        union(tables: [all, groups])
          |> group()
    type: query
---
apiVersion: influxdata.com/v2alpha1
kind: Variable
metadata:
    name: flamboyant-chatelet-e73015
spec:
    language: flux
    name: source-data
    query: |-
        import "influxdata/influxdb/schema"
        import "array"

        all = array.from(rows: [{_value: "ALL"}])

        fields =
          schema.fieldKeys(
            bucket: "source-data",
            predicate: (r) => r._measurement == "source-data",
            start: 2020-01-01T00:00:00Z
          )
          |> filter(fn: (r) =>
            r._value != "timestamp" and
            r._value != "LabViewTime" and
            r._value != "LabviewTime" and
            r._value != "StepNumber" and
            r._value != "Cycle"
          )
          |> keep(columns: ["_value"])

        union(tables: [all, fields])
          |> group()
    selected:
        - ALL
    type: query
