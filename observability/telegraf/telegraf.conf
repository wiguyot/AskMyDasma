# Telegraf configuration to consume a Kafka topic and send it to InfluxDB 2.x

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  logfile = ""
  hostname = "telegraf-dasma"
  omit_hostname = false

###############################################################################
# INPUTS
###############################################################################

[[inputs.kafka_consumer]]
  ## Kafka bootstrap servers, inside your docker-compose network
  ## Recommendation for a multi-broker cluster: list several brokers to avoid a bootstrap single point of failure.
  brokers = ["kafka1:9092"]

  ## Topic to consume
  topics = ["topic-metrics"]

  ## Consumer group id for this Telegraf consumer
  consumer_group = "telegraf-topic-metrics"

  ## Optional: start at the beginning of the topic for the first run
  offset = "oldest"

  ## Format of messages read from the topic
  ## Here: each message is JSON, not Avro
  data_format = "json"

  ## JSON key containing the timestamp, RFC3339
  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05Z07:00"

  ## Dimensional tags, none for this stream: one JSON field per topic, so a column model rather than tag=topic
  tag_keys = []

  ## String fields, none
  json_string_fields = []

  ## Measurement name in InfluxDB
  name_override = "dasma_topic_metrics"


[[inputs.kafka_consumer]]
  ## Kafka bootstrap servers, inside your docker-compose network
  ## Recommendation for a multi-broker cluster: list several brokers to avoid a bootstrap single point of failure.
  brokers = ["kafka1:9092"]

  ## Topic to consume, JSON copy produced by the producer
  topics = ["source-data-viz"]

  ## Consumer group id for this Telegraf consumer
  consumer_group = "telegraf-source-data"

  ## Optional: start at the beginning of the topic for the first run
  offset = "oldest"

  ## Format of messages read from the topic
  data_format = "json"

  ## Use the source timestamp as the InfluxDB time.
  ## Important: your timestamp looks like `2020-12-15 11:15:42`, without a timezone.
  ## - `json_time_format` must match this format exactly.
  ## - without a timezone in the value, Telegraf assumes UTC by default; adapt `json_timezone` if needed.
  json_time_key = "timestamp"
  json_time_format = "2006-01-02 15:04:05"
  # json_timezone = "UTC"   # or "Local" if your timestamps are in local time

  ## Also keep the source timestamp as a string field, optional
  json_string_fields = ["timestamp"]

  ## Put the Group field into a tag, which is more convenient for query filtering
  tag_keys = ["Group"]

  ## Measurement name in InfluxDB
  name_override = "source-data"

