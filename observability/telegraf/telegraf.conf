[[outputs.influxdb_v2]]
  ## InfluxDB service URL (inside the docker-compose network)
  urls = ["http://influxdb:8086"]

  ## Organization
  organization = "dasma"

  ## Target bucket
  bucket = "topic-metrics"

  ## Token: read from the INFLUX_TOKEN environment variable
  token = "${INFLUX_TOKEN}"

  ## Send only the metrics stream measurement to this bucket
  namepass = ["dasma_topic_metrics"]


