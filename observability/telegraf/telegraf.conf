  offset = "oldest"
  data_format = "json"
  json_time_key = "timestamp"
  json_time_format = "2006-01-02 15:04:05"
  json_string_fields = ["timestamp", "source_event_id"]
  tag_keys = ["Group", "source_event_id"]
  name_override = "consensus-analysis"

[[inputs.kafka_consumer]]
  ## Repeatability instance 1 JSON output (generic repeatability test)
  brokers = ["kafka1:9092"]
  topics = ["repeatability-v1-viz"]
  consumer_group = "telegraf-repeatability-v1"
  offset = "oldest"
  data_format = "json"
  json_time_key = "timestamp"
  json_time_format = "2006-01-02 15:04:05"
  json_string_fields = ["timestamp"]
  tag_keys = ["Group"]
  name_override = "repeatability-v1"

[[inputs.kafka_consumer]]
  ## Repeatability instance 2 JSON output (generic repeatability test)
  brokers = ["kafka1:9092"]
  topics = ["repeatability-v2-viz"]
  consumer_group = "telegraf-repeatability-v2"
  offset = "oldest"
  data_format = "json"
  json_time_key = "timestamp"
  json_time_format = "2006-01-02 15:04:05"
  json_string_fields = ["timestamp"]
  tag_keys = ["Group"]
  name_override = "repeatability-v2"

[[inputs.kafka_consumer]]
  ## Score differences published by the repeatability diff service
  brokers = ["kafka1:9092"]
  topics = ["repeatability-diff"]
  consumer_group = "telegraf-repeatability-diff"
  offset = "oldest"
  data_format = "json"
  json_time_key = "timestamp"
  json_time_format = "2006-01-02 15:04:05"
  # Retain the lifecycle reason for the repeatability dashboard. Other JSON
  # strings are not queried there, but emit_reason distinguishes a timeout
  # from a complete comparison.
  json_string_fields = ["timestamp", "source_event_id", "emit_reason"]
  tag_keys = ["Group", "source_event_id"]
  name_override = "repeatability-diff"

[[inputs.kafka_consumer]]
  ## Reproducibility per-event comparison results (phase 2, post-comparison)
  brokers = ["kafka1:9092"]
  topics = ["reproducibility-diff"]
  consumer_group = "telegraf-reproducibility-diff"
  offset = "oldest"
  data_format = "json"
  json_time_key = "timestamp"
  json_time_format = "2006-01-02 15:04:05"
  # Text fields consumed by the reproducibility dashboard tables. The
  # source_event_id tag is intentional: it prevents two events of one group on
  # the same second from overwriting each other; its cardinality stays bounded
  # by the campaign evidence.
  json_string_fields = [
    "timestamp", "timestamp_origin", "source_event_id", "comparison_status",
    "differing_fields", "status_source_1", "status_source_2",
    "timestamp_source_1", "timestamp_source_2",
  ]
  tag_keys = ["campaign_id", "model", "Group", "source_event_id"]
  name_override = "reproducibility-diff"

[[inputs.kafka_consumer]]
  ## Reproducibility batch summary (marker of a fully delivered lot)
  brokers = ["kafka1:9092"]
  topics = ["reproducibility-summary"]
  consumer_group = "telegraf-reproducibility-summary"
  offset = "oldest"
  data_format = "json"
  json_time_key = "timestamp"
  json_time_format = "2006-01-02 15:04:05"
  # The first_divergence_* / first_missing_* markers and the two source images
  # feed the diagnostics table; they are plain strings, never booleans.
  json_string_fields = [
    "timestamp", "source_1_image", "source_2_image",
    "first_divergence_group", "first_divergence_source_event_id",
    "first_divergence_fields", "first_missing_source_1_group",
    "first_missing_source_1_source_event_id", "first_missing_source_2_group",
    "first_missing_source_2_source_event_id",
  ]
  tag_keys = ["campaign_id", "model"]
  name_override = "reproducibility-summary"

[[inputs.kafka_consumer]]
  ## Precomputed V1/V2 SHAP rows: one event/feature point, no Grafana join.
  brokers = ["kafka1:9092"]
  topics = ["explainability-shap-diff"]
  consumer_group = "telegraf-explainability-shap-diff"
  offset = "oldest"
  data_format = "json"
  json_time_key = "timestamp"
  json_time_format = "2006-01-02 15:04:05"
  json_string_fields = ["timestamp", "source_event_id", "feature", "comparison_status"]
  tag_keys = ["Group", "source_event_id", "feature"]
  name_override = "explainability-shap-diff"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  organization = "dasma"
  bucket = "consensus-analysis"
  token = "${INFLUX_TOKEN}"
  namepass = ["consensus-analysis"]

