[[inputs.kafka_consumer]]
  ## Kafka bootstrap servers, inside your docker-compose network
  ## Recommendation for a multi-broker cluster: list several brokers to avoid a bootstrap single point of failure.
  brokers = ["kafka1:9092"]

  ## Topic to consume, JSON copy produced by explainability
  topics = ["explainability-viz"]

  ## Consumer group id for this Telegraf consumer
  consumer_group = "telegraf-explainability"

  ## Optional: start at the beginning of the topic for the first run
  offset = "oldest"

  ## json_v2 with explicit types (V1-04a). The legacy `json` parser drops
  ## string fields that are not listed in json_string_fields and drops
  ## booleans entirely, so `explanation_status` and `hstree_anomaly` never
  ## reached InfluxDB.
  data_format = "json_v2"

  [[inputs.kafka_consumer.json_v2]]
    ## Measurement name in InfluxDB
    measurement_name = "explainability"

    ## Use the source timestamp as the InfluxDB time.
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02 15:04:05"

    [[inputs.kafka_consumer.json_v2.object]]
      path = "@this"
      disable_prepend_keys = true
      included_keys = [
        "explanation_error_code",
        "explained_model",
        "explainability_mode",
        "explanation_method",
        "explanation_profile",
        "explanation_status",
        "explainability_seed",
        "feature_fingerprint",
        "hstree_anomaly",
        "hstree_model_fingerprint",
        "hstree_model_version",
        "hstree_score",
        "hstree_status",
        "hstree_threshold",
        "local_hstree_score",
        "local_score",
        "explained_value",
        "explanation_output",
        "reference_model",
        "reference_score",
        "reference_status",
        "reference_anomaly",
        "reference_threshold",
        "model_version",
        "model_fingerprint",
        "shap_background_size",
        "shap_base_value",
        "shap_computation_time_ms",
        "shap_nsamples",
      ]
      ## `source_event_id` is an intentional tag: it distinguishes events of the
      ## same group produced at the same second. The cardinality cost is real but
      ## acceptable here because it is bounded by the number of campaign events.
      tags = ["Group", "source_event_id", "explained_model"]

      [inputs.kafka_consumer.json_v2.object.fields]
        explanation_error_code = "string"
        explainability_mode = "string"
        explanation_method = "string"
        explanation_profile = "string"
        explanation_status = "string"
        feature_fingerprint = "string"
        hstree_anomaly = "bool"
        hstree_model_fingerprint = "string"
        hstree_model_version = "string"
        hstree_status = "string"
        local_score = "float"
        explained_value = "float"
        explanation_output = "string"
        reference_model = "string"
        reference_score = "float"
        reference_status = "string"
        reference_anomaly = "bool"
        reference_threshold = "float"
        model_version = "string"
        model_fingerprint = "string"

    ## Nested per-feature SHAP map (V1-04a). Same constraints as the V2
    ## block: json_v2 stores nested object keys WITHOUT the parent path
    ## prefix, so `shap_values` contributes bare `<feature>` fields; the
    ## `features` nested map is NOT ingested because its keys would collide
    ## with the SHAP contributions on the same field names. The tags below
    ## resolve only because the V1 runtime publishes Group and source_event_id
    ## INSIDE the shap_values map of the JSON viz copy (json_v2 resolves an
    ## object's tags from the object's own keys only — validated on an
    ## isolated probe). Without them the per-feature points carry no
    ## identity, collide across groups sharing the same second and never
    ## match a Group filter. Keys listed in `tags` are consumed as tags and
    ## do not leak into the field set.
    [[inputs.kafka_consumer.json_v2.object]]
      path = "shap_values"
      tags = ["Group", "source_event_id", "explained_model"]

  ## Measurement name in InfluxDB (kept at the input level for contract tests)
  name_override = "explainability"

[[inputs.kafka_consumer]]
  ## Kafka bootstrap servers, inside your docker-compose network
  ## Recommendation for a multi-broker cluster: list several brokers to avoid a bootstrap single point of failure.
  brokers = ["kafka1:9092"]

  ## Topic to consume, JSON copy produced by explainability-v2 (isolated second explainability model)
  topics = ["explainability-v2-viz"]

  ## Consumer group id for this Telegraf consumer
  consumer_group = "telegraf-explainability-v2"

  ## Optional: start at the beginning of the topic for the first run
  offset = "oldest"

  ## json_v2 with explicit types. The legacy `json` parser drops string fields
  ## that are not listed in json_string_fields and drops booleans entirely, so
  ## `explanation_status` and `hstree_anomaly` never reached InfluxDB.
  data_format = "json_v2"

  [[inputs.kafka_consumer.json_v2]]
    ## Measurement name in InfluxDB
    measurement_name = "explainability-v2"

    ## Use the source timestamp as the InfluxDB time.
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02 15:04:05"

    [[inputs.kafka_consumer.json_v2.object]]
      path = "@this"
      disable_prepend_keys = true
      included_keys = [
        "explanation_error_code",
        "explained_model",
        "explainability_mode",
        "explanation_method",
        "explanation_profile",
        "explanation_status",
        "explainability_seed",
        "feature_fingerprint",
        "hstree_anomaly",
        "hstree_model_fingerprint",
        "hstree_model_version",
        "hstree_score",
        "hstree_status",
        "hstree_threshold",
        "local_hstree_score",
        "local_score",
        "explained_value",
        "explanation_output",
        "reference_model",
        "reference_score",
        "reference_status",
        "reference_anomaly",
        "reference_threshold",
        "model_version",
        "model_fingerprint",
        "shap_background_size",
        "shap_base_value",
        "shap_computation_time_ms",
        "shap_nsamples",
      ]
      ## `source_event_id` is an intentional tag: it distinguishes events of the
      ## same group produced at the same second. The cardinality cost is real but
      ## acceptable here because it is bounded by the number of campaign events.
      tags = ["Group", "source_event_id", "explained_model"]

      [inputs.kafka_consumer.json_v2.object.fields]
        explanation_error_code = "string"
        explainability_mode = "string"
        explanation_method = "string"
        explanation_profile = "string"
        explanation_status = "string"
        feature_fingerprint = "string"
        hstree_anomaly = "bool"
        hstree_model_fingerprint = "string"
        hstree_model_version = "string"
        hstree_status = "string"
        local_score = "float"
        explained_value = "float"
        explanation_output = "string"
        reference_model = "string"
        reference_score = "float"
        reference_status = "string"
        reference_anomaly = "bool"
        reference_threshold = "float"
        model_version = "string"
        model_fingerprint = "string"

    ## Nested per-feature SHAP map. Empirically (telegraf 1.30.3, verified on
    ## a live probe), json_v2 stores nested object keys WITHOUT the parent
    ## path prefix: `shap_values` contributes bare `<feature>` fields. The
    ## `features` nested map is therefore NOT ingested: its keys would collide
    ## with the SHAP contributions on the same field names. No v2 dashboard
    ## panel reads `features_*`.
    ##
    ## The tags below resolve only because the runtime publishes Group and
    ## source_event_id INSIDE the shap_values map of the JSON viz copy
    ## (json_v2 resolves an object's tags from the object's own keys only —
    ## validated on an isolated probe). Without them the per-feature points
    ## carry no identity, collide across groups sharing the same second and
    ## never match a Group filter. Keys listed in `tags` are consumed as tags
    ## and do not leak into the field set.
    [[inputs.kafka_consumer.json_v2.object]]
      path = "shap_values"
      tags = ["Group", "source_event_id", "explained_model"]

  ## Measurement name in InfluxDB (kept at the input level for contract tests)
  name_override = "explainability-v2"

