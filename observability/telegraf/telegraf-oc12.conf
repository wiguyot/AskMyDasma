# OC-12 dedicated Telegraf configuration.
#
# Consumes ONLY the campaign's dedicated explainability-v2 JSON topic and
# writes to the dedicated oc12-campaign bucket under a dedicated measurement.
# Everything is interpolated from the environment provided by
# docker/compose/experiments/docker-compose.oc12.yml, so no standard resource is ever touched.
#
# json_v2 with explicit types: the legacy `json` parser drops string fields
# that are not listed in json_string_fields and drops booleans entirely, so
# `explanation_status` and `hstree_anomaly` would never reach InfluxDB.

[[inputs.kafka_consumer]]
  ## OC-12 campaign topic (dedicated, generated per run)
  brokers = ["kafka1:9092"]
  topics = ["${OC12_V2_VIZ_TOPIC}"]
  consumer_group = "${OC12_TELEGRAF_GROUP}"
  offset = "oldest"

  data_format = "json_v2"

  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "${OC12_MEASUREMENT}"

    ## Use the source timestamp as the InfluxDB time.
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02 15:04:05"

    [[inputs.kafka_consumer.json_v2.object]]
      path = "@this"
      disable_prepend_keys = true
      included_keys = [
        "explanation_error_code",
        "explanation_profile",
        "explanation_status",
        "explainability_seed",
        "feature_fingerprint",
        "hstree_anomaly",
        "hstree_model_fingerprint",
        "hstree_model_version",
        "hstree_score",
        "hstree_status",
        "hstree_threshold",
        "local_hstree_score",
        "local_score",
        "reference_model",
        "reference_score",
        "reference_status",
        "reference_anomaly",
        "reference_threshold",
        "model_version",
        "model_fingerprint",
        "shap_background_size",
        "shap_base_value",
        "shap_computation_time_ms",
        "shap_nsamples",
      ]
      ## `source_event_id` is an intentional tag: it distinguishes events of
      ## the same group produced at the same second.
      tags = ["Group", "source_event_id"]

      [inputs.kafka_consumer.json_v2.object.fields]
        explanation_error_code = "string"
        explanation_profile = "string"
        explanation_status = "string"
        feature_fingerprint = "string"
        hstree_anomaly = "bool"
        hstree_model_fingerprint = "string"
        hstree_model_version = "string"
        hstree_status = "string"
        local_score = "float"
        reference_model = "string"
        reference_score = "float"
        reference_status = "string"
        reference_anomaly = "bool"
        reference_threshold = "float"
        model_version = "string"
        model_fingerprint = "string"

    ## Nested per-feature SHAP map. Empirically (telegraf 1.30.3, verified on
    ## a live probe), json_v2 stores nested object keys WITHOUT the parent
    ## path prefix: `shap_values` contributes bare `<feature>` fields. The
    ## `features` nested map is therefore NOT ingested: its keys would collide
    ## with the SHAP contributions on the same field names.

    [[inputs.kafka_consumer.json_v2.object]]
      path = "shap_values"

[[outputs.influxdb_v2]]
  ## OC-12 dedicated bucket (created by the runner if missing)
  urls = ["http://influxdb:8086"]
  organization = "dasma"
  bucket = "oc12-campaign"
  token = "${INFLUX_TOKEN}"
