      REPEATABILITY_ANOMALY_FIELD: "${REPEATABILITY_ANOMALY_FIELD:-hstree_anomaly}"
      REPEATABILITY_EXTRA_FIELDS: "${REPEATABILITY_EXTRA_FIELDS:-}"
      REPEATABILITY_TIMEOUT_SEC: "${REPEATABILITY_TIMEOUT_SEC:-30}"
      REPEATABILITY_RETENTION_SEC: "${REPEATABILITY_RETENTION_SEC:-300}"
      DASMA_ENABLED: "${DASMA_REPEATABILITY_ENABLED:-0}"
      PIP_CACHE_DIR: "/pip-cache"
    networks: [kafka-net]
    depends_on:
      init-topic:
        condition: service_completed_successfully
    entrypoint: ["python", "/app/validation/repeatability/repeatability_diff.py"]
    restart: "no"

  # Precomputed per-feature SHAP comparison. Disabled by default so existing
  # campaigns are not changed until this stream is explicitly enabled.
  explainability-shap-diff:
    image: dasma-kafka-kafka-tools:0.1.0
    container_name: explainability-shap-diff
    working_dir: /app
    volumes:
      - ./:/app:ro
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      SHAP_DIFF_V1_TOPIC: "${SHAP_DIFF_V1_TOPIC:-explainability-viz}"
      SHAP_DIFF_V2_TOPIC: "${SHAP_DIFF_V2_TOPIC:-explainability-v2-viz}"
      SHAP_DIFF_DEST_TOPIC: "${SHAP_DIFF_DEST_TOPIC:-explainability-shap-diff}"
      SHAP_DIFF_GROUP_ID: "${SHAP_DIFF_GROUP_ID:-explainability-shap-diff-consumer}"
      DASMA_ENABLED: "${DASMA_SHAP_DIFF_ENABLED:-0}"
      PYTHONPATH: "/app"
    networks: [kafka-net]
    depends_on:
      init-topic:
        condition: service_completed_successfully
    entrypoint: ["python", "/app/validation/explainability/shap_diff_service.py"]
    restart: "no"

  # Reproducibility CSV exporter (phase 2): consumes the tested model's viz
  # topic of a normal campaign and writes the evidence CSV + metadata under
  # data/reproducibility/<campaign-id>/ on the host. Mount the exporter code
  # directly, rather than a read-only /app parent with a writable child: that
  # nested layout is not writable under Docker Desktop. The output bind is
  # intentionally writable and is excluded from Git.
  reproducibility-export:
    image: dasma-kafka-kafka-tools:0.1.0
    container_name: reproducibility-export
    working_dir: /app
    volumes:
      - ./validation/reproducibility:/app/validation/reproducibility:ro
      - ./data/reproducibility:/app/data/reproducibility
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      DASMA_ENABLED: "${DASMA_REPRODUCIBILITY_ENABLED:-0}"
      REPRODUCIBILITY_MODEL_ID: "${REPRODUCIBILITY_MODEL_ID:-}"
      REPRODUCIBILITY_SOURCE_ROLE: "${REPRODUCIBILITY_SOURCE_ROLE:-}"
      REPRODUCIBILITY_CAMPAIGN_ID: "${REPRODUCIBILITY_CAMPAIGN_ID:-}"
      REPRODUCIBILITY_SOURCE_TOPIC: "${REPRODUCIBILITY_SOURCE_TOPIC:-}"
      REPRODUCIBILITY_GROUP_ID: "${REPRODUCIBILITY_GROUP_ID:-}"
      REPRODUCIBILITY_OUTPUT_ROOT: "${REPRODUCIBILITY_OUTPUT_ROOT:-/app/data/reproducibility}"
      REPRODUCIBILITY_IDLE_EXIT_SEC: "${REPRODUCIBILITY_IDLE_EXIT_SEC:-15}"
      REPRODUCIBILITY_STARTUP_TIMEOUT_SEC: "${REPRODUCIBILITY_STARTUP_TIMEOUT_SEC:-300}"
      REPRODUCIBILITY_IMAGE: "${REPRODUCIBILITY_IMAGE:-}"
      REPRODUCIBILITY_CAMPAIGN_PARAMETERS_JSON: "${REPRODUCIBILITY_CAMPAIGN_PARAMETERS_JSON:-}"
    networks: [kafka-net]
    depends_on:
      init-topic:
        condition: service_completed_successfully
    entrypoint: ["python", "/app/validation/reproducibility/export_topic_to_csv.py"]
    restart: "no"

  # Reproducibility observability publisher (phase 2): manual one-shot service.
  # It never starts automatically (no DASMA_ENABLED) and is launched after a
  # successful comparison with:
  #   docker compose run --rm --no-deps reproducibility-publish \
  #     --report /app/data/reproducibility/<campaign-id>/<model>-comparison.csv
  # --no-deps assumes the platform is running and the topics exist. The read-only
  # mounts guarantee the command never touches the exports source nor metadata.
  reproducibility-publish:
    image: dasma-kafka-kafka-tools:0.1.0
    container_name: reproducibility-publish
    working_dir: /app
    volumes:
      - ./validation/reproducibility:/app/validation/reproducibility:ro
      - ./data/reproducibility:/app/data/reproducibility:ro
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      REPRODUCIBILITY_DIFF_TOPIC: "reproducibility-diff"
      REPRODUCIBILITY_SUMMARY_TOPIC: "reproducibility-summary"
    networks: [kafka-net]
    depends_on:
      init-topic:
        condition: service_completed_successfully
    entrypoint: ["python", "/app/validation/reproducibility/publish_comparison_to_kafka.py"]
    restart: "no"


  explainability:
    build:
      context: .
      dockerfile: services/explainability/Dockerfile
    image: dasma-kafka-explainability:0.1.0
    container_name: explainability
    working_dir: /app
    volumes:
      - ./:/app
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_SOURCE_TOPIC: "${EXPLAINABILITY_SOURCE_TOPIC:-}"
      EXPLAINABILITY_MODEL: "${EXPLAINABILITY_MODEL:-}"
      EXPLAINABILITY_MODE: "${EXPLAINABILITY_MODE:-}"
      EXPLAINABILITY_METHOD: "${EXPLAINABILITY_METHOD:-}"
      KAFKA_DEST_TOPIC: "explainability"
      KAFKA_DEST_TOPIC_JSON:  "explainability-viz"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      TOPIC_PARTITIONS: "1"
      TOPIC_RF: "3"
      LOG_LEVEL: "INFO"
      # HSTree configuration; it must match the HSTree analysis service.
      HSTREE_INITIAL_WINDOW_SIZE: "${HSTREE_INITIAL_WINDOW_SIZE:-256}"
      HSTREE_WINDOW_SIZE: "${HSTREE_WINDOW_SIZE:-256}"
      HSTREE_NUM_TREES: "${HSTREE_NUM_TREES:-25}"
      HSTREE_VARIANT: "${HSTREE_VARIANT:-paper}"
      HSTREE_MAX_DEPTH: "${HSTREE_MAX_DEPTH:-15}"
      ANALYSE_SEED: "${ANALYSE_SEED:-42}"
      HSTREE_EXCLUDE_FIELDS: "${DASMA_EXCLUDED_FIELDS:-source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber}"

      # IForest configuration; it must match the IForest analysis service.
      IFOREST_INITIAL_WINDOW_SIZE: "${IFOREST_INITIAL_WINDOW_SIZE:-512}"
      IFOREST_WINDOW_SIZE: "${IFOREST_WINDOW_SIZE:-2048}"
      IFOREST_EXCLUDE_FIELDS: "${DASMA_EXCLUDED_FIELDS:-source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber}"
      IFOREST_N_ESTIMATORS: "${IFOREST_N_ESTIMATORS:-100}"
      IFOREST_MAX_SAMPLES: "${IFOREST_MAX_SAMPLES:-256}"
      IFOREST_CONTAMINATION: "${IFOREST_CONTAMINATION:-auto}"
      IFOREST_REFIT_EVERY: "${IFOREST_REFIT_EVERY:-128}"

      # KitNET configuration; expressions match the kitnet-analysis service.
      KITNET_MAX_SIZE_AE: "${KITNET_MAX_SIZE_AE:-10}"
      KITNET_GRACE_FEATURE_MAPPING: "${KITNET_GRACE_FEATURE_MAPPING:-1000}"
      KITNET_GRACE_ANOMALY_DETECTOR: "${KITNET_GRACE_ANOMALY_DETECTOR:-1000}"
      KITNET_LEARNING_RATE: "${KITNET_LEARNING_RATE:-0.1}"
      KITNET_HIDDEN_RATIO: "${KITNET_HIDDEN_RATIO:-0.75}"
      KITNET_EXCLUDE_FIELDS: "${DASMA_EXCLUDED_FIELDS:-source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber}"

      # SHAP configuration
      SHAP_BACKGROUND_SIZE: "100"
      SHAP_NSAMPLES: "${EXPLAINABILITY_SHAP_NSAMPLES:-100}"
      SHAP_ENABLED: "true"
      # Deterministic floating-point: pin BLAS/OpenMP to a single thread so
      # KernelSHAP's ill-conditioned regression is reproducible across runs.
      # See docs/models/explainability/v2/explainabilities-problems.md (action 1).
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      DASMA_ENABLED: "${DASMA_EXPLAINABILITY_ENABLED:-1}"
      PIP_CACHE_DIR: "/pip-cache"
    networks: [kafka-net]     
    depends_on: 
      init-topic:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    entrypoint: ["python", "/app/runtime/explainability/regular/explainability-multi-thread-by-group.py"]
    restart: "no"

  # Isolated second explainability model. Fine copy of the explainability service,
  # wired to the explainability_v2 package, with its own topics, consumer group,
  # and kill switch. It never replaces the regular explainability outputs.
  explainability-v2:
    build:
      context: .
      dockerfile: services/explainability/Dockerfile
    image: dasma-kafka-explainability:0.1.0
    container_name: explainability-v2
    working_dir: /app
    volumes:
      - ./:/app
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_SOURCE_TOPIC: "${EXPLAINABILITY_V2_SOURCE_TOPIC:-}"
      EXPLAINABILITY_MODEL: "${EXPLAINABILITY_V2_MODEL:-}"
      EXPLAINABILITY_MODE: "${EXPLAINABILITY_V2_MODE:-}"
      EXPLAINABILITY_METHOD: "${EXPLAINABILITY_V2_METHOD:-}"
      KAFKA_DEST_TOPIC: "explainability-v2"
      KAFKA_DEST_TOPIC_JSON:  "explainability-v2-viz"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      EXPLAINABILITY_GROUP_ID: "explainability-v2-consumer"
      TOPIC_PARTITIONS: "1"
      TOPIC_RF: "3"
      LOG_LEVEL: "INFO"
      # HSTree configuration; it must match the HSTree analysis service.
      HSTREE_INITIAL_WINDOW_SIZE: "${HSTREE_INITIAL_WINDOW_SIZE:-256}"
      HSTREE_WINDOW_SIZE: "${HSTREE_WINDOW_SIZE:-256}"
      HSTREE_NUM_TREES: "${HSTREE_NUM_TREES:-25}"
      HSTREE_VARIANT: "${HSTREE_VARIANT:-paper}"
      HSTREE_MAX_DEPTH: "${HSTREE_MAX_DEPTH:-15}"
      ANALYSE_SEED: "${ANALYSE_SEED:-42}"
      HSTREE_EXCLUDE_FIELDS: "${DASMA_EXCLUDED_FIELDS:-source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber}"

      # IForest configuration; it must match the IForest analysis service.
      IFOREST_INITIAL_WINDOW_SIZE: "${IFOREST_INITIAL_WINDOW_SIZE:-512}"
      IFOREST_WINDOW_SIZE: "${IFOREST_WINDOW_SIZE:-2048}"
      IFOREST_EXCLUDE_FIELDS: "${DASMA_EXCLUDED_FIELDS:-source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber}"
      IFOREST_N_ESTIMATORS: "${IFOREST_N_ESTIMATORS:-100}"
      IFOREST_MAX_SAMPLES: "${IFOREST_MAX_SAMPLES:-256}"
      IFOREST_CONTAMINATION: "${IFOREST_CONTAMINATION:-auto}"
      IFOREST_REFIT_EVERY: "${IFOREST_REFIT_EVERY:-128}"

      # KitNET configuration; expressions match the kitnet-analysis service.
      KITNET_MAX_SIZE_AE: "${KITNET_MAX_SIZE_AE:-10}"
      KITNET_GRACE_FEATURE_MAPPING: "${KITNET_GRACE_FEATURE_MAPPING:-1000}"
      KITNET_GRACE_ANOMALY_DETECTOR: "${KITNET_GRACE_ANOMALY_DETECTOR:-1000}"
      KITNET_LEARNING_RATE: "${KITNET_LEARNING_RATE:-0.1}"
      KITNET_HIDDEN_RATIO: "${KITNET_HIDDEN_RATIO:-0.75}"
      KITNET_EXCLUDE_FIELDS: "${DASMA_EXCLUDED_FIELDS:-source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber}"

      # SHAP configuration
      SHAP_BACKGROUND_SIZE: "100"
      SHAP_NSAMPLES: "${EXPLAINABILITY_V2_SHAP_NSAMPLES:-100}"
      SHAP_ENABLED: "true"
      # Deterministic floating-point: pin BLAS/OpenMP to a single thread so
      # KernelSHAP's ill-conditioned regression is reproducible across runs.
      # See docs/models/explainability/v2/explainabilities-problems.md (action 1).
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      DASMA_ENABLED: "${DASMA_EXPLAINABILITY_V2_ENABLED:-0}"
      PIP_CACHE_DIR: "/pip-cache"
    networks: [kafka-net]
    depends_on:
      init-topic:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    entrypoint: ["python", "/app/runtime/explainability/v2/explainability_v2.py"]
    restart: "no"

  grafana:
    image: grafana/grafana:12.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      # Persistent volume for all Grafana data (users, internal DB, etc.)
      - grafana-data:/var/lib/grafana
      # Provisioning (datasources + dashboards.yml)
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      # Dashboard JSON files (in your repository)
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_EXPLORE_ENABLED: "false"
      GF_INSTALL_PLUGINS: "hamedkarbasi93-kafka-datasource"
    networks: [kafka-net]
    depends_on:
      kafka1:
        condition: service_started
      init-topic:
        condition: service_completed_successfully

  build-metrics:
    build:
      context: .
      dockerfile: services/kafka-tools/Dockerfile
    image: dasma-kafka-kafka-tools:0.1.0
    container_name: build-metrics
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      init-topic:
        condition: service_completed_successfully
    networks:
      - kafka-net
    volumes:
      - ./observability/metrics:/app/observability/metrics:ro
      - ./src:/app/src:ro
      - pip-cache:/pip-cache
    working_dir: /app
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      METRICS_TOPICS: "source-data,source-data-viz,hstree-analysis,hstree-analysis-viz,iforest-analysis,iforest-analysis-viz,kitnet-analysis,kitnet-analysis-viz,deepant-analysis,deepant-analysis-viz,mdragstream-point-analysis,mdragstream-point-analysis-viz,explainability,explainability-viz,explainability-v2,explainability-v2-viz,consensus-analysis"
      METRICS_TOPIC_NAME: "topic-metrics"
      TEMPORISATION: "1"        # In seconds.
      LOG_LEVEL: "INFO"
      PIP_CACHE_DIR: "/pip-cache"
    entrypoint: ["python", "/app/observability/metrics/build-metrics.py"]

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "admin"
      DOCKER_INFLUXDB_INIT_PASSWORD: "adminpass"
      DOCKER_INFLUXDB_INIT_ORG: "dasma"
      DOCKER_INFLUXDB_INIT_BUCKET: "topic-metrics"
      DOCKER_INFLUXDB_INIT_RETENTION: "0"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "dasma-super-token"
    networks: [kafka-net]
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  influxdb-init-buckets:
    image: influxdb:2.7
    container_name: influxdb-init-buckets
    depends_on:
      influxdb:
        condition: service_healthy
    networks: [kafka-net]
    environment:
      INFLUX_TOKEN: "dasma-super-token"
      INFLUX_ORG: "dasma"
    entrypoint:
      - sh
      - -ec
      - |
        set -e
        INFLUX_HOST="http://influxdb:8086"
        echo "[influxdb-init-buckets] watcher started"

        # Wait until InfluxDB is reachable
        while ! influx ping --host "$${INFLUX_HOST}" >/dev/null 2>&1; do
          echo "[influxdb-init-buckets] waiting for influxdb at $${INFLUX_HOST} ..."
          sleep 2
        done

        ensure_no_retention() {
          BN="$${1}"
          echo "[influxdb-init-buckets] ensuring bucket $${BN} ..."

          # Get bucket ID by name (if exists)
          BID="$$(influx bucket list --host "$${INFLUX_HOST}" --org "$${INFLUX_ORG}" --token "$${INFLUX_TOKEN}" --hide-headers -n "$${BN}" 2>/dev/null | head -n1 | awk '{print $$1}')"

          if [ -n "$${BID}" ]; then
            influx bucket update --host "$${INFLUX_HOST}" --id "$${BID}" --retention 0 --token "$${INFLUX_TOKEN}" >/dev/null
          else
            influx bucket create --host "$${INFLUX_HOST}" --org "$${INFLUX_ORG}" --name "$${BN}" --retention 0 --token "$${INFLUX_TOKEN}" >/dev/null
          fi
        }

        ensure_no_retention "topic-metrics"

        # Base topics
        ensure_no_retention "source-data"
        ensure_no_retention "hstree-analysis"
        ensure_no_retention "iforest-analysis"
        ensure_no_retention "kitnet-analysis"
        ensure_no_retention "deepant-analysis"
        ensure_no_retention "mdragstream-point-analysis"
        ensure_no_retention "explainability"
        ensure_no_retention "explainability-v2"
        ensure_no_retention "consensus-analysis"
        ensure_no_retention "repeatability-v1"
        ensure_no_retention "repeatability-v2"
        ensure_no_retention "repeatability-diff"
        ensure_no_retention "reproducibility-diff"
        ensure_no_retention "reproducibility-summary"
        ensure_no_retention "explainability-shap-diff"

        # Viz / bridge topics (JSON via Telegraf/Grafana)


        touch /tmp/buckets_ready
        echo "[influxdb-init-buckets] buckets ensured"
        echo "[influxdb-init-buckets] done -> exiting"
    restart: "no"

  influxdb-apply-template:
    image: influxdb:2.7
    container_name: influxdb-apply-template
    depends_on:
      influxdb:
        condition: service_healthy
      influxdb-init-buckets:
        condition: service_completed_successfully
    networks: [kafka-net]
    volumes:
      - ./observability/influxdb:/templates:ro
    environment:
      INFLUX_TOKEN: "dasma-super-token"
      INFLUX_ORG: "dasma"
    entrypoint:
      - sh
      - -ec
      - |
        set -e
        INFLUX_HOST="http://influxdb:8086"
        TEMPLATE="/templates/dasma-template.yml"

        echo "[influxdb-apply-template] started"

        # Wait until InfluxDB is reachable
        while ! influx ping --host "$${INFLUX_HOST}" >/dev/null 2>&1; do
          echo "[influxdb-apply-template] waiting for influxdb at $${INFLUX_HOST} ..."
          sleep 2
        done

        echo "[influxdb-apply-template] influxdb reachable -> applying template"
        until influx apply --host "$${INFLUX_HOST}" --org "$${INFLUX_ORG}" --token "$${INFLUX_TOKEN}" -f "$${TEMPLATE}" --force yes; do
          echo "[influxdb-apply-template] apply failed; retrying in 2s..."
          sleep 2
        done

        echo "[influxdb-apply-template] template applied"
        echo "[influxdb-apply-template] done -> exiting"
    restart: "no"

  telegraf:
    image: telegraf:1.30
    container_name: telegraf
    depends_on:
      build-metrics:
        condition: service_started
      kafka1:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      init-topic:
        condition: service_completed_successfully
      influxdb-apply-template:
        condition: service_completed_successfully
    networks:
      - kafka-net
    volumes:
      - ./observability/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      INFLUX_TOKEN: "dasma-super-token"
    restart: unless-stopped

  # Optional service — start explicitly with:
  #   docker compose --profile askmydasma-container up askmydasma-web
  # or via a dedicated start command. Not started by default.
  #
  # WARNING: mounts /var/run/docker.sock — grants the container full control
  # over the Docker host. Acceptable for local development only.
  askmydasma-web:
    build:
      context: .
      dockerfile: services/askmydasma/Dockerfile
    image: dasma-kafka-askmydasma:0.1.0
    container_name: askmydasma-web
    profiles: [askmydasma-container]
    ports:
      - "8000:8000"
    environment:
      ASKMYDASMA_PROJECT_ROOT: /project
      ASKMYDASMA_SCRIPTS_DIR: /project/scripts
      ASKMYDASMA_WEB_SCRIPTS_DIR: /project/scripts/web
      ASKMYDASMA_DATA_DIR: /project/data
      ASKMYDASMA_TMP_DIR: /project/.tmp
      ASKMYDASMA_FRONTEND_DIR: /project/frontend/askmydasma
      ASKMYDASMA_GRAFANA_URL: "http://localhost:3000"
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-dasma-kafka}"
      ASKMYDASMA_HOST_PROJECT_ROOT: "${PWD}"
      PYTHONPATH: "/project/src"
    volumes:
      - .:/project:rw
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      kafka1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      grafana:
        condition: service_started
    restart: unless-stopped
    networks: [kafka-net]

networks:
  kafka-net: {}

volumes:
  grafana-data: {}
  pip-cache: {}
  influxdb-data: {}
