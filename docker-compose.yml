      MDRAGPOINT_EXCLUDE_FIELDS: "${DASMA_EXCLUDED_FIELDS:-source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber}"
      MDRAGPOINT_VERDICT_MODE: "${MDRAGPOINT_VERDICT_MODE:-internal}"
      MDRAGPOINT_ANOMALY_K_SIGMA: "${MDRAGPOINT_ANOMALY_K_SIGMA:-3.0}"
