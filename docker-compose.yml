services:
  kafka1:
    image: apache/kafka:3.9.2
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CLUSTER_ID=kUz30inARj2NKpW25I6K6A
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://kafka1:9092,CONTROLLER://kafka1:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka1:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    healthcheck:
      test: ["CMD", "bash", "-lc", "cat < /dev/null > /dev/tcp/kafka1/9092"]
      interval: 10s
      timeout: 2s
      retries: 30
      start_period: 90s
    networks: [kafka-net]

  kafka2:
    image: apache/kafka:3.9.2
    container_name: kafka2
    environment:
      - KAFKA_CLUSTER_ID=kUz30inARj2NKpW25I6K6A
      - KAFKA_NODE_ID=2
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://kafka2:9092,CONTROLLER://kafka2:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka2:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    healthcheck:
      test: ["CMD", "bash", "-lc", "cat < /dev/null > /dev/tcp/kafka2/9092"]
      interval: 10s
      timeout: 2s
      retries: 30
      start_period: 90s
    networks: [kafka-net]

  kafka3:
    image: apache/kafka:3.9.2
    container_name: kafka3
    environment:
      - KAFKA_CLUSTER_ID=kUz30inARj2NKpW25I6K6A
      - KAFKA_NODE_ID=3
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://kafka3:9092,CONTROLLER://kafka3:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka3:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    healthcheck:
      test: ["CMD", "bash", "-lc", "cat < /dev/null > /dev/tcp/kafka3/9092"]
      interval: 10s
      timeout: 2s
      retries: 30
      start_period: 90s
    networks: [kafka-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: dasma-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    restart: unless-stopped
    networks: [kafka-net]

  schema-registry:
    image: ghcr.io/aiven/karapace:latest
    container_name: schema-registry
    entrypoint: ["/venv/bin/karapace", "/config/karapace.json"]
    volumes:
      - ./services/karapace/karapace.json:/config/karapace.json:ro
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/config')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [kafka-net]

  init-topic:
    build:
      context: .
      dockerfile: services/kafka-tools/Dockerfile
    image: dasma-kafka-kafka-tools:0.1.0
    container_name: init-topic
    working_dir: /app
    volumes:
      - ./runtime/bootstrap/init-topic:/app/runtime/bootstrap/init-topic:ro
      - ./src:/app/src:ro
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"

      # Component data topic
      TOPIC_NAME1: "source-data"
      TOPIC_PARTITIONS1: "1"
      TOPIC_RF1: "3"

      # Analysis topic
      TOPIC_NAME2: "hstree-analysis"
      TOPIC_PARTITIONS2: "1"
      TOPIC_RF2: "3"

      # Explainability computation topic
      TOPIC_NAME3: "explainability"
      TOPIC_PARTITIONS3: "1"
      TOPIC_RF3: "3"

      # HSTree analysis visualization topic in Grafana
      TOPIC_NAME4: "hstree-analysis-viz"
      TOPIC_PARTITIONS4: "1"
      TOPIC_RF4: "3"

      # Dedicated metrics topic
      TOPIC_NAME5: "topic-metrics"
      TOPIC_PARTITIONS5: "1"
      TOPIC_RF5: "3"

      # Explainability visualization topic (JSON for Grafana/Telegraf)
      TOPIC_NAME6: "explainability-viz"
      TOPIC_PARTITIONS6: "1"
      TOPIC_RF6: "3"

      # IForest analysis topic
      TOPIC_NAME7: "iforest-analysis"
      TOPIC_PARTITIONS7: "1"
      TOPIC_RF7: "3"

      # IForest analysis visualization topic
      TOPIC_NAME8: "iforest-analysis-viz"
      TOPIC_PARTITIONS8: "1"
      TOPIC_RF8: "3"

      LOG_LEVEL: "INFO"

      # Component visualization topic (JSON for Influx/Telegraf)
      TOPIC_NAME9: "source-data-viz"
      TOPIC_PARTITIONS9: "1"
      TOPIC_RF9: "3"
      
      # KitNet analysis topic
      TOPIC_NAME10: "kitnet-analysis"
      TOPIC_PARTITIONS10: "1"
      TOPIC_RF10: "3"

      # KitNet analysis visualization topic
      TOPIC_NAME11: "kitnet-analysis-viz"
      TOPIC_PARTITIONS11: "1"
      TOPIC_RF11: "3"

      # Consensus analysis topic
      TOPIC_NAME12: "consensus-analysis"
      TOPIC_PARTITIONS12: "1"
      TOPIC_RF12: "3"

      # DeepAnT analysis topic
      TOPIC_NAME13: "deepant-analysis"
      TOPIC_PARTITIONS13: "1"
      TOPIC_RF13: "3"

      # DeepAnT analysis visualization topic
      TOPIC_NAME14: "deepant-analysis-viz"
      TOPIC_PARTITIONS14: "1"
      TOPIC_RF14: "3"

      # mDragStream Point-based analysis topic
      TOPIC_NAME15: "mdragstream-point-analysis"
      TOPIC_PARTITIONS15: "1"
      TOPIC_RF15: "3"

      # mDragStream Point-based analysis visualization topic
      TOPIC_NAME16: "mdragstream-point-analysis-viz"
      TOPIC_PARTITIONS16: "1"
      TOPIC_RF16: "3"

      # Explainability v2 analysis topic (isolated second explainability model)
      TOPIC_NAME17: "explainability-v2"
      TOPIC_PARTITIONS17: "1"
      TOPIC_RF17: "3"

      # Explainability v2 visualization topic (JSON for Influx/Telegraf)
      TOPIC_NAME18: "explainability-v2-viz"
      TOPIC_PARTITIONS18: "1"
      TOPIC_RF18: "3"

      # Repeatability test topics (phase 1: generic pair + diff service)
      TOPIC_NAME19: "repeatability-v1"
      TOPIC_PARTITIONS19: "1"
      TOPIC_RF19: "3"

      TOPIC_NAME20: "repeatability-v1-viz"
      TOPIC_PARTITIONS20: "1"
      TOPIC_RF20: "3"

      TOPIC_NAME21: "repeatability-v2"
      TOPIC_PARTITIONS21: "1"
      TOPIC_RF21: "3"

      TOPIC_NAME22: "repeatability-v2-viz"
      TOPIC_PARTITIONS22: "1"
      TOPIC_RF22: "3"

      TOPIC_NAME23: "repeatability-diff"
      TOPIC_PARTITIONS23: "1"
      TOPIC_RF23: "3"

      # Reproducibility observability topics (phase 2): results JSON post-comparison.
      TOPIC_NAME24: "reproducibility-diff"
      TOPIC_PARTITIONS24: "1"
      TOPIC_RF24: "3"

      TOPIC_NAME25: "reproducibility-summary"
      # Precomputed SHAP V1/V2 comparison rows (one event/feature point)
      TOPIC_NAME26: "explainability-shap-diff"
      TOPIC_PARTITIONS26: "1"
      TOPIC_RF26: "3"
      TOPIC_PARTITIONS25: "1"
      TOPIC_RF25: "3"

      PIP_CACHE_DIR: "/pip-cache"
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        sleep 15 &&
        python /app/runtime/bootstrap/init-topic/init-topics.py
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks: [kafka-net]     

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    image: dasma-kafka-producer:0.1.0
    container_name: producer
    working_dir: /app
    volumes:
      - ./:/app:ro
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      TOPIC_NAME: "source-data"
      DATA_SOURCE_FILE: "${DATA_SOURCE_FILE:-data/source-10000.csv}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      # Delay between message sends, in seconds.
      TIME_DELAY: "0.0001"
      PIP_CACHE_DIR: "/pip-cache"
      # Optional producer mode, for example realtime. Value inherited from the shell.
      DASMA_PRODUCER_TRANSFORMATION: "${DASMA_PRODUCER_TRANSFORMATION:-}"
      # Optional comma-separated Group values to keep before Kafka publication.
      DASMA_SELECTED_GROUPS: "${DASMA_SELECTED_GROUPS:-}"
      # Columns removed from the source stream before Kafka publication.
      DASMA_EXCLUDED_FIELDS: "${DASMA_EXCLUDED_FIELDS:-}"
      # When enabled, the producer waits for an explicit start signal before emitting records.
      DASMA_PRODUCER_WAIT_FOR_START: "${DASMA_PRODUCER_WAIT_FOR_START:-0}"
      DASMA_PRODUCER_START_SIGNAL_FILE: "${DASMA_PRODUCER_START_SIGNAL_FILE:-/tmp/dasma-producer-start.signal}"

    networks: [kafka-net]     
    depends_on: 
      init-topic:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    restart: "no"
  

  hstree-analysis:
    build:
      context: .
      dockerfile: services/anomaly-light/Dockerfile
    image: dasma-kafka-anomaly-light:0.1.0
    container_name: hstree-analysis
    working_dir: /app
    volumes:
      - ./:/app:ro
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_SOURCE_TOPIC: "source-data"
      KAFKA_DEST_TOPIC: "hstree-analysis"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      # TOPIC 
      TOPIC_PARTITIONS: "1"
      TOPIC_RF: "3"
      LOG_LEVEL: "INFO"
      # HSTREE parameters
      HSTREE_INITIAL_WINDOW_SIZE: "${HSTREE_INITIAL_WINDOW_SIZE:-256}"
      HSTREE_WINDOW_SIZE: "${HSTREE_WINDOW_SIZE:-256}"
      HSTREE_NUM_TREES: "${HSTREE_NUM_TREES:-25}"
      HSTREE_VARIANT: "${HSTREE_VARIANT:-paper}"
      HSTREE_MAX_DEPTH: "${HSTREE_MAX_DEPTH:-15}"
      HSTREE_EXCLUDE_FIELDS: "${DASMA_EXCLUDED_FIELDS:-source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber}"

      HSTREE_ANOMALY_K_SIGMA: "${HSTREE_ANOMALY_K_SIGMA:-3.0}"
      HSTREE_ANOMALY_MIN_SAMPLES: "${HSTREE_ANOMALY_MIN_SAMPLES:-100}"
      HSTREE_THRESHOLD_MODE: "${HSTREE_THRESHOLD_MODE:-p99}"
      HSTREE_THRESHOLD_PERCENTILE: "${HSTREE_THRESHOLD_PERCENTILE:-99.0}"
      HSTREE_THRESHOLD_WINDOW: "${HSTREE_THRESHOLD_WINDOW:-500}"
      HSTREE_WELFORD_WINDOW: "${HSTREE_WELFORD_WINDOW:-2048}"
      ANALYSE_SEED: "${ANALYSE_SEED:-42}"   # For reproducibility.
      DASMA_ENABLED: "${DASMA_HSTREE_ENABLED:-1}"
      PIP_CACHE_DIR: "/pip-cache"
    networks: [kafka-net]
    depends_on:
      init-topic:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    entrypoint: ["python", "/app/runtime/detectors/hstree/hstree_analysis.py"]
    restart: "no"


  iforest-analysis:
    build:
      context: .
      dockerfile: services/anomaly-sklearn/Dockerfile
    image: dasma-kafka-anomaly-sklearn:0.1.0
    container_name: iforest-analysis
    working_dir: /app
    volumes:
      - ./:/app:ro
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_SOURCE_TOPIC: "source-data"
      KAFKA_DEST_TOPIC: "iforest-analysis"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"

      # Reproducibility, important for iForest.
      ANALYSE_SEED: "${ANALYSE_SEED:-42}"

      # iForest parameters
      IFOREST_INITIAL_WINDOW_SIZE: "${IFOREST_INITIAL_WINDOW_SIZE:-512}"
      IFOREST_WINDOW_SIZE: "${IFOREST_WINDOW_SIZE:-2048}"
      IFOREST_EXCLUDE_FIELDS: "${DASMA_EXCLUDED_FIELDS:-source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber}"

      # scikit-learn IsolationForest parameters (Liu et al., 2008): psi = max_samples, t = n_estimators.
      IFOREST_N_ESTIMATORS: "${IFOREST_N_ESTIMATORS:-100}"
      IFOREST_MAX_SAMPLES: "${IFOREST_MAX_SAMPLES:-256}"
      IFOREST_CONTAMINATION: "${IFOREST_CONTAMINATION:-auto}"
      IFOREST_REFIT_EVERY: "${IFOREST_REFIT_EVERY:-128}"
      IFOREST_ANOMALY_K_SIGMA: "${IFOREST_ANOMALY_K_SIGMA:-3.0}"
      IFOREST_ANOMALY_MIN_SAMPLES: "${IFOREST_ANOMALY_MIN_SAMPLES:-100}"
      IFOREST_THRESHOLD_MODE: "${IFOREST_THRESHOLD_MODE:-native}"
      IFOREST_THRESHOLD_PERCENTILE: "${IFOREST_THRESHOLD_PERCENTILE:-99.0}"
      IFOREST_THRESHOLD_WINDOW: "${IFOREST_THRESHOLD_WINDOW:-500}"
      IFOREST_WELFORD_WINDOW: "${IFOREST_WELFORD_WINDOW:-2048}"

      LOG_LEVEL: "INFO"
      DASMA_ENABLED: "${DASMA_IFOREST_ENABLED:-1}"
      PIP_CACHE_DIR: "/pip-cache"
    networks: [kafka-net]
    depends_on:
      init-topic:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    entrypoint: ["python", "/app/runtime/detectors/iforest/iforest_analysis.py"]
    restart: "no"


  kitnet-analysis:
    build:
      context: .
      dockerfile: services/anomaly-light/Dockerfile
    image: dasma-kafka-anomaly-light:0.1.0
    container_name: kitnet-analysis
    working_dir: /app
    volumes:
      - ./:/app:ro
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_SOURCE_TOPIC: "source-data"
      KAFKA_DEST_TOPIC: "kitnet-analysis"
      KAFKA_DEST_VIZ_TOPIC: "kitnet-analysis-viz"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"

      # Reproducibility.
      ANALYSE_SEED: "42"

      # KitNet parameters (PySAD / KitNET-py)
      KITNET_MAX_SIZE_AE: "${KITNET_MAX_SIZE_AE:-10}"
      # Optional: set an integer to force the FM grace period, or "None" to let PySAD manage it.
      KITNET_GRACE_FEATURE_MAPPING: "${KITNET_GRACE_FEATURE_MAPPING:-1000}"
      KITNET_GRACE_ANOMALY_DETECTOR: "${KITNET_GRACE_ANOMALY_DETECTOR:-1000}"
      KITNET_LEARNING_RATE: "${KITNET_LEARNING_RATE:-0.1}"
      KITNET_HIDDEN_RATIO: "${KITNET_HIDDEN_RATIO:-0.75}"
      KITNET_CLIP: "${KITNET_CLIP:-10.0}"
      KITNET_THRESHOLD_MODE: "${KITNET_THRESHOLD_MODE:-welford-windowed}"
      KITNET_THRESHOLD_WINDOW: "${KITNET_THRESHOLD_WINDOW:-500}"
      KITNET_WELFORD_WINDOW: "${KITNET_WELFORD_WINDOW:-500}"
      KITNET_THRESHOLD_PERCENTILE: "${KITNET_THRESHOLD_PERCENTILE:-99.0}"
      KITNET_ANOMALY_K_SIGMA: "${KITNET_ANOMALY_K_SIGMA:-3.0}"
      KITNET_ANOMALY_WARMUP_WINDOW: "${KITNET_ANOMALY_WARMUP_WINDOW:-50}"
      KITNET_ANOMALY_MIN_SAMPLES: "${KITNET_ANOMALY_MIN_SAMPLES:-100}"

      # Fields excluded from the feature vector.
      KITNET_EXCLUDE_FIELDS: "${DASMA_EXCLUDED_FIELDS:-source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber}"

      LOG_LEVEL: "INFO"
      DASMA_ENABLED: "${DASMA_KITNET_ENABLED:-1}"
      PIP_CACHE_DIR: "/pip-cache"
    networks: [kafka-net]
    depends_on:
      init-topic:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    entrypoint: ["python", "/app/runtime/detectors/kitnet/kitnet_analysis_pysad_cpu.py"]
    restart: "no"


  deepant-analysis:
    build:
      context: .
      dockerfile: services/deepant/Dockerfile
    image: dasma-kafka-deepant:0.1.0
    container_name: deepant-analysis
    working_dir: /app
    volumes:
      - ./:/app:ro
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_SOURCE_TOPIC: "source-data"
      KAFKA_DEST_TOPIC: "deepant-analysis"
      KAFKA_DEST_VIZ_TOPIC: "deepant-analysis-viz"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      TOPIC_PARTITIONS: "1"
      TOPIC_RF: "3"
      LOG_LEVEL: "INFO"

      # Reproducibility.
      ANALYSE_SEED: "42"

      # DeepAnT hyperparameters (CNN predictor)
      DEEPANT_LOOKBACK_SIZE: "${DEEPANT_LOOKBACK_SIZE:-100}"
      DEEPANT_INITIAL_WINDOW_SIZE: "${DEEPANT_INITIAL_WINDOW_SIZE:-512}"
      DEEPANT_REFIT_EVERY: "${DEEPANT_REFIT_EVERY:-128}"
      DEEPANT_WINDOW_SIZE: "${DEEPANT_WINDOW_SIZE:-2048}"
      DEEPANT_FILTERS: "${DEEPANT_FILTERS:-32}"
      DEEPANT_KERNEL_SIZE: "${DEEPANT_KERNEL_SIZE:-2}"
      DEEPANT_DROPOUT: "${DEEPANT_DROPOUT:-0.25}"
      DEEPANT_LR: "${DEEPANT_LR:-0.001}"
      DEEPANT_EPOCHS_INITIAL: "${DEEPANT_EPOCHS_INITIAL:-10}"
      DEEPANT_EPOCHS_REFIT: "${DEEPANT_EPOCHS_REFIT:-5}"
      DEEPANT_BATCH_SIZE: "${DEEPANT_BATCH_SIZE:-32}"

      # Fields excluded from the feature vector.
      DEEPANT_EXCLUDE_FIELDS: "${DASMA_EXCLUDED_FIELDS:-source_event_id,timestamp,Group,group,Cycle,LabviewTime,time,StepNumber,State (0=OK 1=Warning 2=Error),BackgroundSubtracted(0/1),ActionNumber}"

      # Anomaly trigger configuration.
      DEEPANT_ANOMALY_K_SIGMA: "${DEEPANT_ANOMALY_K_SIGMA:-3.0}"
      DEEPANT_ANOMALY_MIN_SAMPLES: "${DEEPANT_ANOMALY_MIN_SAMPLES:-100}"
      DEEPANT_THRESHOLD_MODE: "${DEEPANT_THRESHOLD_MODE:-welford-windowed}"
      DEEPANT_THRESHOLD_PERCENTILE: "${DEEPANT_THRESHOLD_PERCENTILE:-99.0}"
      DEEPANT_THRESHOLD_WINDOW: "${DEEPANT_THRESHOLD_WINDOW:-500}"
      DEEPANT_WELFORD_WINDOW: "${DEEPANT_WELFORD_WINDOW:-2048}"

      DEEPANT_PARALLEL_BY_GROUP: "${DEEPANT_PARALLEL_BY_GROUP:-1}"
      DEEPANT_MAX_GROUP_WORKERS: "${DEEPANT_MAX_GROUP_WORKERS:-2}"
      DEEPANT_GROUP_QUEUE_MAXSIZE: "${DEEPANT_GROUP_QUEUE_MAXSIZE:-1000}"
      DEEPANT_CPU_THREADS_PER_WORKER: "${DEEPANT_CPU_THREADS_PER_WORKER:-1}"

      DASMA_ENABLED: "${DASMA_DEEPANT_ENABLED:-1}"
      PIP_CACHE_DIR: "/pip-cache"
    networks: [kafka-net]
    depends_on:
      init-topic:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    entrypoint: ["python", "/app/runtime/detectors/deepant/deepant_analysis.py"]
    restart: "no"

  mdragstream-point-analysis:
    build:
      context: .
      dockerfile: services/anomaly-sklearn/Dockerfile
    image: dasma-kafka-anomaly-sklearn:0.1.0
    container_name: mdragstream-point-analysis
    working_dir: /app
    volumes:
      - ./:/app:ro
      - pip-cache:/pip-cache
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_SOURCE_TOPIC: "source-data"
      KAFKA_DEST_TOPIC: "mdragstream-point-analysis"
      KAFKA_DEST_VIZ_TOPIC: "mdragstream-point-analysis-viz"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      TOPIC_PARTITIONS: "1"
      TOPIC_RF: "3"
      LOG_LEVEL: "INFO"

      # Reproducibility.
      ANALYSE_SEED: "42"

      # mDragStream Point-based parameters.
      MDRAGPOINT_DYNAMIC_THRESHOLD: "${MDRAGPOINT_DYNAMIC_THRESHOLD:-1}"
      MDRAGPOINT_LOF_INIT: "${MDRAGPOINT_LOF_INIT:-1}"
      MDRAGPOINT_N_INIT: "${MDRAGPOINT_N_INIT:-1000}"
      MDRAGPOINT_MAX_NB_CLUSTERS: "${MDRAGPOINT_MAX_NB_CLUSTERS:-50}"
      MDRAGPOINT_MAX_CLUSTER_SIZE: "${MDRAGPOINT_MAX_CLUSTER_SIZE:-30}"
      MDRAGPOINT_METRIC: "${MDRAGPOINT_METRIC:-mahalanobis}"
      MDRAGPOINT_THRESHOLD_METHOD: "${MDRAGPOINT_THRESHOLD_METHOD:-std}"
      MDRAGPOINT_THRESHOLD_T: "${MDRAGPOINT_THRESHOLD_T:-2.0}"
      MDRAGPOINT_LOF_NEIGHBORS: "${MDRAGPOINT_LOF_NEIGHBORS:-20}"

